server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web's bootstrap/service-worker files must always be
    # revalidated — otherwise browsers keep serving a stale service worker
    # that intercepts requests and re-serves an old main.dart.js forever,
    # even after a fresh deploy (classic "why isn't my change showing" bug).
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
